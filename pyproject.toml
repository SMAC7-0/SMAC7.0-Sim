[project]
name = "inchworm-sim"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["mujoco", "numpy"]

[project.optional-dependencies]
dev = ["trimesh"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inchworm_sim*"]